name: Package

# Builds the Linux AppImage and the Android APK.
#  - every push to main and manual runs: artifacts are attached to the workflow run
#  - tags like v0.1.0: the artifacts are also published as a GitHub Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_APK_VERSION: "0.10.0"

jobs:
  appimage:
    name: Linux AppImage (x86_64)
    # Older Ubuntu so the binary links against an older glibc and runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p darklight

      - name: Assemble AppDir
        run: |
          install -Dm755 target/release/darklight AppDir/usr/bin/darklight
          install -Dm644 packaging/linux/darklight.desktop AppDir/usr/share/applications/darklight.desktop
          install -Dm644 packaging/linux/darklight.png AppDir/usr/share/icons/hicolor/256x256/apps/darklight.png
          cp packaging/linux/darklight.desktop AppDir/darklight.desktop
          cp packaging/linux/darklight.png AppDir/darklight.png
          ln -s darklight.png AppDir/.DirIcon
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/darklight" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p dist
          # The runner has no FUSE, so run the tool extracted.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/Darklight-x86_64.AppImage

      - name: Check the AppImage
        run: |
          chmod +x dist/Darklight-x86_64.AppImage
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/dist/Darklight-x86_64.AppImage" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/darklight
          # Every shared library the binary links against must resolve on the runner.
          if ldd squashfs-root/usr/bin/darklight | grep "not found"; then
            echo "unresolved shared libraries" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: darklight-appimage
          path: dist/Darklight-x86_64.AppImage
          if-no-files-found: error

  apk:
    name: Android APK (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK and NDK
        run: |
          # The runner image ships the SDK and NDK; point cargo-apk at them and make sure
          # the platform and build-tools for our target SDK are installed.
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache cargo-apk
        id: cache-cargo-apk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: cargo-apk-${{ env.CARGO_APK_VERSION }}-${{ runner.os }}

      - name: Install cargo-apk
        if: steps.cache-cargo-apk.outputs.cache-hit != 'true'
        run: cargo install cargo-apk --version "$CARGO_APK_VERSION" --locked

      - name: Create the signing keystore
        # Sideload-grade signing only; see docs/ROADMAP.md (Phase 2) for real release signing.
        # The path must match [package.metadata.android.signing.release] in crates/darklight/Cargo.toml.
        run: |
          mkdir -p crates/darklight/.signing
          keytool -genkey -v \
            -keystore crates/darklight/.signing/sideload.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Darklight Sideload,O=Darklight,C=US"

      - name: Build APK
        run: cargo apk build --release --lib -p darklight

      - name: Collect APK
        run: |
          mkdir -p dist
          APK="$(find target/release/apk -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK" || { echo "no APK was produced" >&2; exit 1; }
          cp "$APK" dist/Darklight-aarch64.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: darklight-apk
          path: dist/Darklight-aarch64.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
